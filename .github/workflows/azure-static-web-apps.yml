name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Stamp deployment metadata
        shell: bash
        run: |
          deployed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          printf '{\n  "deployedAtUtc": "%s",\n  "commitSha": "%s"\n}\n' "$deployed_at" "$GITHUB_SHA" > Client/wwwroot/deployment.json

      - name: Publish client
        run: dotnet publish Client/BlazorBasic.csproj -c Release -o publish/client

      - name: Publish API
        run: dotnet publish Api/SignalBrief.Api.csproj -c Release -o publish/api

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/client/wwwroot
          api_location: publish/api
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request environment
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
